# Despliegue continuo en Firebase Hosting.
#
# Cada cambio que llegue a main se verifica y se publica en sgcc-jv.web.app.
# Hubo brevemente un ambiente de calidad aparte; se retiró por decisión del
# investigador y se trabaja sobre un único proyecto.
#
# Se despliega SOLO hosting, nunca functions. La función del modelo de lenguaje
# necesita el plan Blaze y el secreto ANTHROPIC_API_KEY; se despliega a mano.
#
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT_SGCC_JV, con el JSON de una
# cuenta de servicio con permiso de «Firebase Hosting Admin».

name: Desplegar en Firebase Hosting

on:
  push:
    branches: [main]
    # Un cambio en el README no merece un despliegue.
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - ".github/workflows/desplegar-hosting.yml"
  workflow_dispatch:

# Si se empujan dos cambios seguidos, gana el último: no tiene sentido publicar
# una versión que ya quedó vieja mientras sube.
concurrency:
  group: hosting-produccion
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # OJO: `node --check archivo.js` NO sirve para estos archivos. Con un
      # módulo ES roto devuelve 0 y deja pasar el error. Hay que forzar el
      # análisis como módulo por la entrada estándar.
      - name: Sintaxis de los módulos del navegador
        run: |
          fallo=0
          for f in public/app/*.js; do
            if node --input-type=module --check < "$f"; then
              echo "OK   $f"
            else
              echo "ROTO $f"; fallo=1
            fi
          done
          exit $fallo

      - name: Sintaxis de la función servidor
        run: node --check functions/index.js

      - name: Los datos son JSON válido
        run: |
          for f in public/datos/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              && echo "OK   $f" || exit 1
          done

      # El grafo es el dato del que depende todo lo demás. No se valida la
      # ontología aquí (eso es pySHACL, y va aparte), solo que el archivo esté
      # y no llegue truncado o vacío por un fallo al copiarlo.
      - name: El grafo está y tiene contenido
        run: |
          f=public/datos/etul4_completa.ttl
          test -s "$f" || { echo "falta $f o está vacío"; exit 1; }
          grep -q "@prefix etul:" "$f" || { echo "$f no declara el prefijo etul:"; exit 1; }
          grep -q "owl:equivalentClass" "$f" || { echo "$f no trae clases definidas"; exit 1; }
          echo "OK   $f ($(wc -l < "$f") líneas)"

      # Cada pestaña de index.html tiene que tener su sección, y cada vista
      # declarada en auth.js tiene que existir como pestaña. Descuadrar esto
      # deja un rol con una pestaña que no abre nada, y no se nota hasta
      # cambiar de rol en producción.
      - name: Las vistas, las pestañas y los roles concuerdan
        run: node .github/scripts/comprobar-vistas.mjs

  comprobar-secreto:
    name: ¿Hay con qué publicar?
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      hay: ${{ steps.e.outputs.hay }}
    steps:
      - id: e
        # Comparar contra vacío es seguro: el valor nunca se imprime, y GitHub
        # enmascara los secretos en el registro de todas formas.
        env:
          SEC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGCC_JV != '' }}
        run: |
          echo "hay=$SEC" >> $GITHUB_OUTPUT
          # Sin el secreto no se puede publicar. Se avisa y se omite, en vez de
          # fallar: un aspa roja sin explicación hace perder más tiempo que un
          # aviso que dice exactamente qué falta.
          if [ "$SEC" != "true" ]; then
            {
              echo "### Publicación omitida"
              echo "Falta el secreto \`FIREBASE_SERVICE_ACCOUNT_SGCC_JV\`."
              echo "Se crea con \`firebase init hosting:github\`; ver LEEME_DESPLIEGUE.md."
            } >> $GITHUB_STEP_SUMMARY
          fi

  desplegar:
    name: Publicar en Hosting
    needs: comprobar-secreto
    if: needs.comprobar-secreto.outputs.hay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar al canal en producción
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SGCC_JV }}
          projectId: sgcc-jv
          channelId: live

      - name: Decir dónde quedó
        run: echo "Publicado en https://sgcc-jv.web.app" >> $GITHUB_STEP_SUMMARY
